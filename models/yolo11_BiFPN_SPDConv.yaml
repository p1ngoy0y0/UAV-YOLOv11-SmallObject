# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect
 
# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.5, 0.5, 1024] 

 
# YOLOv11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Focus, [256, 3]]   
    
  - [-1, 1, Focus, [512, 3]]  
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  
  
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8   80 
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  
  
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16  40 
  - [-1, 2, C3k2, [512, True]] # 6         
  
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 20 
  - [-1, 2, C3k2, [1024, True]] # 8        
  - [-1, 1, SPPF, [1024, 5]] # 9           
  - [-1, 2, C2PSA, [1024]] # 10            

# YOLOv11.0-P2 head
head:
  #P5>P4
  - [-1, 1, Conv, [512, 1, 1]] # 11                             · 20 × 20 × 512
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12             · 40 × 40 × 512
  - [[-1, 6], 1, BiFPN_Concat, [256, 256]] # cat backbone P4    · 40 × 40 × 512(11) + 40 × 40 × 512(6)
  - [-1, 2, C2f, [512]] # 14                                    · 40 × 40 × 512
  #P4>P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15             · 80 × 80 × 256
  - [[-1, 4], 1, BiFPN_Concat, [256, 256]] # cat backbone P3    · 80 × 80 × 256(15) + 80 × 80 × 256(4)
  - [-1, 2, C2f, [256]] # 17 (P3/8-small)                       · 80 × 80 × 256
  #P3>P2
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18             · 160 × 160 × 128
  - [[-1, 2], 1, BiFPN_Concat, [128, 128]] # cat backbone P2      · 160 × 160 × 128(19) + 160 × 160 × 128(2)
  - [-1, 2, C2f, [256]] # 20 (P2/4-tiny)                        · 160 × 160 × 128                    

  #P2>P3 
  - [-1, 1, Conv, [512, 3, 2]] # 21                             · 80 × 80 × 128
  - [17, 1, Conv, [512, 1, 1]]
  - [[-1, -2, 4], 1, BiFPN_Concat, [256, 256]] # cat head P3     · 80 × 80 × 128(23) + 80 × 80 × 128(22) + 80 × 80 × 128(18)
  - [-1, 2, C2f, [256]] # 24 (P3/8-small)                       · 80 × 80 × 256
  #P3>P4
  - [-1, 1, Conv, [512, 3, 2]] # 25                             · 40 × 40 × 256
  - [[-1, 6, 14], 1, BiFPN_Concat, [256, 256]] # cat head P4   · 40 × 40 × 256(27) + 40 × 40 × 256(26) + 40 × 40 × 256(14)
  - [-1, 2, C2f, [512]] # 27 (P4/16-medium)                     · 40 × 40 × 512                                    
 
  - [[20, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)  